include:
  - manifests/base/silverblue.yaml
  - manifests/features/root-pythia6.yaml
  - manifests/features/cvmfs.yaml
  - manifests/features/evtgen.yaml
  # - manifests/features/howdy.yaml
  # - manifests/features/iwd.yaml
  # - manifests/features/aptx.yaml
  # - manifests/features/latex.yaml
  # - manifests/features/nvidia.yaml
ref: fedora/44/${basearch}/karuboniru-silverblue
releasever: 44
rojig:
  name: fedora-silverblue
  summary: "Fedora Silverblue base image"
  license: MIT

variables:
  bootable_container: true
  exclude_perl: false

packages:
  # Input method / CJK support
  - fcitx5
  - fcitx5-autostart
  - fcitx5-chinese-addons
  - fcitx5-configtool
  - fcitx5-gtk
  - fcitx5-mozc
  - fcitx5-qt

  # Shell & system utilities
  - zsh
  - htop
  - wireguard-tools
  - git-lfs
  - btrbk
  - smartmontools
  - ddcutil
  - sedutil
  - iperf3

  # Fedora packaging tools
  - koji
  - fedpkg
  - copr-cli

  # Compilers & build tools
  - gcc
  - gcc-c++
  - gcc-gfortran
  - clang
  - clang-analyzer
  - clang-tools-extra
  - llvm
  - lld
  - lldb
  - mold
  - cmake
  - meson
  - ninja-build
  - gdb
  - bear
  - patch
  - libasan

  # Development libraries
  - /usr/include/eigen3
  - json-devel
  - gsl-devel
  - boost-devel
  - liburing-devel
  - python3-devel
  - python3-libdnf5

  # Profiling & analysis
  - perf
  - valgrind
  - strace
  - binwalk

  # HEP / physics build dependencies (GENIE, NuWro, GiBUU)
  - libxml2-devel
  - pythia8-devel
  - log4cpp-devel
  - libnsl2-devel
  - lhapdf-devel
  - /usr/lib64/libbz2.so

  # HEP data access (XRootD, VOMS)
  - xrootd-client
  - xrootd-voms
  - voms-clients-cpp
  - rclone

  # InfiniBand / RDMA
  - libibverbs
  - libibverbs-utils
  - infiniband-diags
  - rdma-core
  - mstflint
  - qperf
  - perftest

  # Security / authentication
  - tpm2-pkcs11
  - tpm2-pkcs11-tools
  - tpm2-tools
  - seahorse
  - gnupg2-scdaemon
  - p11-kit-client
  - ykclient
  - ykpers
  - yubikey-manager
  - openssl

  # Virtualization & containers
  - virt-install
  - libvirt-dbus
  - libvirt-daemon-config-network
  - libvirt-daemon-kvm
  - qemu-kvm
  - virt-manager
  - virt-viewer
  - libguestfs-tools
  - python3-libguestfs
  - virt-top
  - gnome-boxes
  - crun-krun
  - krunvm
  - muvm

  # Developer tools & editors
  - code
  - gh
  - zig
  - uv

  # Desktop utilities
  - evince
  - evince-djvu
  - kmscon
  - kmscon-gl

  # CJK fonts (for typst)
  - google-noto-serif-cjk-fonts
  - google-noto-sans-cjk-fonts

  # Perl modules (for TexLive utilities)
  - "perl(Cwd)"
  - "perl(Data::Dumper)"
  - "perl(Digest::MD5)"
  - "perl(Encode)"
  - "perl(File::Basename)"
  - "perl(File::Copy)"
  - "perl(File::Find)"
  - "perl(File::HomeDir)"
  - "perl(File::Path)"
  - "perl(File::Spec)"
  - "perl(File::Spec::Functions)"
  - "perl(File::Temp)"
  - "perl(FileHandle)"
  - "perl(FindBin)"
  - "perl(Getopt::Long)"
  - "perl(List::Util)"
  - "perl(Text::Tabs)"
  - "perl(Text::Wrap)"
  - "perl(Time::HiRes)"
  - "perl(Unicode::Normalize)"
  - "perl(YAML::Tiny)"
  - "perl(lib)"
  - "perl(open)"
  - "perl(sigtrap)"
  - "perl(vars)"

  # System libraries & compatibility
  - libcurl
  - aardvark-dns
  - gmp
  - libssh2
  - mbedtls
  - libxcrypt-compat

exclude-packages:
  - low-memory-monitor
  - passim
  - gnome-session-xsession
  - hplip-gui

repos:
  - fedora
  - fedora-updates
  - fedora-updates-testing
  - vscode
  - dummy
  - pythia6
  # - llvm-snapshot
  # - llvm-snapshot-rundep

postprocess:
  - |
    systemctl enable sshd.socket
    systemctl enable rpm-ostreed-automatic.timer
    rm /etc/grub.d/30_os-prober
    sudo ln -s /usr/lib/systemd/system/kmsconvt@.service /etc/systemd/system/autovt@.service

add-files:
  [
    [
      "./etc/systemd/system.conf.d/accounting.conf",
      "/etc/systemd/system.conf.d/accounting.conf",
    ],
    ["./etc/udev/rules.d/keyboard.rules", "/etc/udev/rules.d/keyboard.rules"],
    [
      "./etc/udev/rules.d/logitech-unifying.rules",
      "/etc/udev/rules.d/logitech-unifying.rules",
    ],
    ["./etc/udev/rules.d/nvme-usb.rules", "/etc/udev/rules.d/nvme-usb.rules"],
    ["./etc/udev/rules.d/rtl-sdr.rules", "/etc/udev/rules.d/rtl-sdr.rules"],
    ["./etc/udev/rules.d/wd-disk.rules", "/etc/udev/rules.d/wd-disk.rules"],
    [
      "./etc/polkit-1/rules.d/49-nopasswd_global.rules",
      /etc/polkit-1/rules.d/49-nopasswd_global.rules,
    ],
    ["./etc/krb5.conf.d/CC_IN2P3_FR", "/etc/krb5.conf.d/CC_IN2P3_FR"],
    ["./etc/krb5.conf.d/IHEP_AC_CN", "/etc/krb5.conf.d/IHEP_AC_CN"],
    [
      "./etc/ssh/sshd_config.d/40-nopassword.conf",
      "/etc/ssh/sshd_config.d/40-nopassword.conf",
    ],
    ["./etc/rpm-ostreed.conf", "/etc/rpm-ostreed.conf"],
  ]
