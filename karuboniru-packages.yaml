include:
  - silverblue.yaml
  # - howdy.yaml
  - root-pythia6.yaml
  - iwd.yaml
  - aptx.yaml
  # - nvidia.yaml
ref: fedora/43/${basearch}/karuboniru-silverblue
releasever: 43
rojig:
  name: fedora-silverblue
  summary: "Fedora Silverblue base image"
  license: MIT

variables:
  bootable_container: true
  exclude_perl: false

packages:
  - fcitx5
  - fcitx5-autostart
  - fcitx5-chinese-addons
  - fcitx5-configtool
  - fcitx5-gtk
  - fcitx5-mozc
  - fcitx5-qt
  - zsh
  - htop
  - wireguard-tools
  - systemd-container
  - bootc
  # GENIE & NuWro build dependencies
  - libxml2-devel
  - pythia8-devel
  - log4cpp-devel
  - libnsl2-devel
  - lhapdf-devel
  # GiBUU
  - /usr/lib64/libbz2.so
  # Fedora
  - koji
  - fedpkg
  - copr-cli
  # General building tools
  - libasan
  - binwalk
  - valgrind
  - /usr/include/eigen3
  - json-devel
  - strace
  - clang-tools-extra
  - bear
  - patch
  - ninja-build
  - cmake
  - gcc
  - gcc-c++
  - gcc-gfortran
  - llvm
  - mold
  # - "'clang(major) = 20'"
  - clang
  - clang-analyzer
  - lld
  - lldb
  - meson
  - gdb
  - xrootd-client
  - xrootd-voms
  - rclone
  # vscode
  - code
  # for running TexLive
  - "perl(Cwd)"
  - "perl(Digest::MD5)"
  - "perl(Encode)"
  - "perl(File::Basename)"
  - "perl(File::Copy)"
  - "perl(File::Find)"
  - "perl(File::Path)"
  - "perl(File::Spec::Functions)"
  - "perl(FileHandle)"
  - "perl(List::Util)"
  - "perl(Time::HiRes)"
  - "perl(Unicode::Normalize)"
  - "perl(sigtrap)"
  - "perl(vars)"
  - "perl(File::Find)"
  - "perl(File::Temp)"
  - "perl(File::Spec)"
  - "perl(Data::Dumper)"
  - "perl(File::HomeDir)"
  - "perl(FindBin)"
  - "perl(Getopt::Long)"
  - "perl(Text::Tabs)"
  - "perl(Text::Wrap)"
  - "perl(YAML::Tiny)"
  - "perl(lib)"
  - "perl(open)"
  # for full curl
  - libcurl
  # there can be cases where aardvark-dns is missing
  - aardvark-dns
  # for linking against liburing
  - liburing-devel
  # tpm2 protected ssh key
  - tpm2-pkcs11
  - tpm2-pkcs11-tools
  - tpm2-tools
  # non VF fonts for typst
  - google-noto-serif-cjk-fonts
  - google-noto-sans-cjk-fonts
  # https://bodhi.fedoraproject.org/updates/FEDORA-2024-8a00986001 breaks the compose
  # until it is fixed:
  - gmp
  - libssh2
  - mbedtls
  # GSConnect wants openssl
  - openssl
  # for Valor
  - gsl-devel
  # daily coding
  - perf
  - boost-devel
  # monitor brightness control
  - ddcutil
  - btrbk
  - python3-devel
  - python3-libdnf5
  - dnf5
  - git-lfs
  - smartmontools
  # for biber from upstream texlive
  - libxcrypt-compat
  # play with krun
  - crun-krun
  # libvirt
  - virt-install
  - libvirt-dbus
  - libvirt-daemon-config-network
  - libvirt-daemon-kvm
  - qemu-kvm
  - virt-manager
  - virt-viewer
  - libguestfs-tools
  - python3-libguestfs
  - virt-top
  - tinysparql
  - localsearch
  - sedutil
  - iperf3

  - libibverbs
  - libibverbs-utils
  - infiniband-diags
  - rdma-core
  - mstflint
  - qperf
  - perftest

  # Evince PDF viewer
  - evince
  - evince-djvu
  - evince-previewer
  - evince-thumbnailer

  # VOMS and Xrootd
  - xrootd-voms xrootd-client voms-clients-cpp

  - seahorse
  - gnupg2-scdaemon
  - p11-kit-client
  - ykclient
  - ykpers
  - yubikey-manager
  - gh

  - zig

  - krunvm

exclude-packages:
  - low-memory-monitor
  - passim
  - gnome-session-xsession
  - hplip-gui

repos:
  - fedora-43
  - fedora-43-updates
  - fedora-43-updates-testing
  - vscode
  # - llvm-snapshot
  # - llvm-snapshot-rundep

postprocess:
  - |
    systemctl enable sshd.socket
    systemctl enable rpm-ostreed-automatic.timer
    rm /etc/grub.d/30_os-prober
    echo -e '[composefs]\nenabled=yes' >> /usr/lib/ostree/prepare-root.conf

add-files:
  [
    [
      "./etc/systemd/system.conf.d/accounting.conf",
      "/etc/systemd/system.conf.d/accounting.conf",
    ],
    ["./etc/udev/rules.d/keyboard.rules", "/etc/udev/rules.d/keyboard.rules"],
    [
      "./etc/udev/rules.d/logitech-unifying.rules",
      "/etc/udev/rules.d/logitech-unifying.rules",
    ],
    ["./etc/udev/rules.d/nvme-usb.rules", "/etc/udev/rules.d/nvme-usb.rules"],
    ["./etc/udev/rules.d/rtl-sdr.rules", "/etc/udev/rules.d/rtl-sdr.rules"],
    ["./etc/udev/rules.d/wd-disk.rules", "/etc/udev/rules.d/wd-disk.rules"],
    [
      "./etc/polkit-1/rules.d/49-nopasswd_global.rules",
      /etc/polkit-1/rules.d/49-nopasswd_global.rules,
    ],
    ["./etc/krb5.conf.d/CC_IN2P3_FR", "/etc/krb5.conf.d/CC_IN2P3_FR"],
    ["./etc/krb5.conf.d/IHEP_AC_CN", "/etc/krb5.conf.d/IHEP_AC_CN"],
    [
      "./etc/ssh/sshd_config.d/40-nopassword.conf",
      "/etc/ssh/sshd_config.d/40-nopassword.conf",
    ],
    ["./etc/rpm-ostreed.conf", "/etc/rpm-ostreed.conf"],
  ]
