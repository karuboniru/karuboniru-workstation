include:
  - manifests/base/silverblue.yaml
  - manifests/packages/input-method.yaml
  - manifests/packages/system-utilities.yaml
  - manifests/packages/development.yaml
  - manifests/packages/hep.yaml
  - manifests/packages/rdma.yaml
  - manifests/packages/authentication.yaml
  - manifests/packages/virtualization.yaml
  - manifests/packages/desktop.yaml
  - manifests/packages/texlive-perl.yaml
  - manifests/features/root-pythia6.yaml
  - manifests/features/cvmfs.yaml
  - manifests/features/evtgen.yaml
  - manifests/features/gundu.yaml
  # - manifests/features/howdy.yaml
  # - manifests/features/iwd.yaml
  # - manifests/features/aptx.yaml
  # - manifests/features/latex.yaml
  # - manifests/features/nvidia.yaml
arch-include:
  x86_64:
    - manifests/features/codex-tui.yaml
ref: fedora/45/${basearch}/karuboniru-silverblue
releasever: 45
rojig:
  name: fedora-silverblue-karuboniru
  summary: "Karuboniru's Silverblue Workstation"
  license: MIT

variables:
  bootable_container: true
  exclude_perl: false

exclude-packages:
  - ebtables-legacy
  - iptables-legacy
  - iptables-legacy-libs
  - iptables-nft
  - libvirt-daemon-driver-nwfilter
  - iptstate
  - libvirt-daemon-kvm
  - gnome-boxes
  - low-memory-monitor
  - passim
  - gnome-session-xsession
  - hplip-gui
  - gnome-software
  - gnome-software-rpm-ostree

repos:
  - fedora
  - fedora-updates
  - fedora-updates-testing
  - vscode
  - dummy
  - pythia6
  - agent-vm
  - NetBird
  # - llvm-snapshot
  # - llvm-snapshot-rundep

postprocess:
  - |
    systemctl enable sshd.socket
    systemctl enable rpm-ostreed-automatic.timer
    rm /etc/grub.d/30_os-prober
    sudo ln -sfn /usr/lib/systemd/system/kmsconvt@.service /etc/systemd/system/autovt@.service

    # Replace keyring PAM actions with success, preserving stack entries without requiring keyring.
    sed -E -i --follow-symlinks \
      '/^[[:space:]]*#/! s@([[:space:]])([^[:space:]]*/)?pam_gnome_keyring\.so([[:space:]].*)?$@\1pam_permit.so@' \
      /etc/pam.d/*
