include:
  - manifests/base/silverblue.yaml
  - manifests/features/root-pythia6.yaml
  - manifests/features/cvmfs.yaml
  - manifests/features/evtgen.yaml
  - manifests/features/gundu.yaml
  # - manifests/features/howdy.yaml
  - manifests/features/iwd.yaml
  # - manifests/features/aptx.yaml
  # - manifests/features/latex.yaml
  # - manifests/features/nvidia.yaml
ref: fedora/45/${basearch}/karuboniru-silverblue
releasever: 45
rojig:
  name: fedora-silverblue-karuboniru
  summary: "Karuboniru's Silverblue Workstation"
  license: MIT

variables:
  bootable_container: true
  exclude_perl: false

packages:
  # Input method / CJK support
  - fcitx5
  - fcitx5-autostart
  - fcitx5-chinese-addons
  - fcitx5-configtool
  - fcitx5-gtk
  - fcitx5-mozc
  - fcitx5-qt

  # Shell & system utilities
  - zsh
  - ripgrep
  - htop
  - wireguard-tools
  - git-lfs
  - btrbk
  - bees
  - smartmontools
  - ddcutil
  - sedutil
  - iperf3

  # Fedora packaging tools
  - koji
  - fedpkg
  - copr-cli

  # Compilers & build tools
  - gcc
  - gcc-c++
  - gcc-gfortran
  - clang
  - clang-analyzer
  - clang-tools-extra
  - llvm
  - lld
  - lldb
  - mold
  - cmake
  - meson
  - ninja-build
  - gdb
  - bear
  - patch
  - libasan

  # Development libraries
  - /usr/include/eigen3
  - json-devel
  - gsl-devel
  - boost-devel
  - liburing-devel
  - python3-devel
  - python3-libdnf5
  - 'pkgconfig(expat)'
  - 'pkgconfig(x11)'
  - 'pkgconfig(opengl)'
  - 'pkgconfig(libcurl)'
  - 'cmake(zstd)'

  # Profiling & analysis
  - perf
  - valgrind
  - strace
  - binwalk

  # HEP / physics build dependencies (GENIE, NuWro, GiBUU)
  - libxml2-devel
  - pythia8-devel
  - log4cpp-devel
  - libnsl2-devel
  - lhapdf-devel
  - /usr/lib64/libbz2.so

  # HEP data access (XRootD, VOMS)
  - xrootd-client
  - xrootd-voms
  - voms-clients-cpp
  - rclone

  # InfiniBand / RDMA
  - libibverbs
  - libibverbs-utils
  - infiniband-diags
  - rdma-core
  - mstflint
  - qperf
  - perftest

  # Security / authentication
  - tpm2-pkcs11
  - tpm2-pkcs11-tools
  - tpm2-tools
  - seahorse
  - gnupg2-scdaemon
  - p11-kit-client
  - ykclient
  - ykpers
  - yubikey-manager
  - openssl
  - cargo-credential-oo7
  - git-credential-oo7
  - oo7-cli
  - oo7-daemon
  - oo7-portal
  - pam_oo7

  # Virtualization & containers
  - virt-install
  - libvirt-dbus
  - libvirt-daemon-config-network
  - libvirt-daemon-kvm
  - qemu-kvm
  - virt-manager
  - virt-viewer
  - libguestfs-tools
  - python3-libguestfs
  - virt-top
  - gnome-boxes
  - crun-krun
  - krunvm
  - muvm
  - bcvk
  - apptainer

  # Developer tools & editors
  - gh
  - zig
  - uv
  - nodejs24
  - nodejs24-bin
  - nodejs24-devel
  - nodejs24-full-i18n
  - nodejs24-npm
  - nodejs24-npm-bin
  - pnpm

  # Desktop utilities
  - evince
  - evince-djvu
  - gpaste
  - gnome-shell-extension-gpaste
  - kmscon
  - kmscon-pango
  - kmscon-freetype
  - kmscon-gl

  # Printer drivers
  - foomatic-db
  - foomatic-db-ppds

  # Perl modules (for TexLive utilities)
  - "perl(Cwd)"
  - "perl(Data::Dumper)"
  - "perl(Digest::MD5)"
  - "perl(Encode)"
  - "perl(File::Basename)"
  - "perl(File::Copy)"
  - "perl(File::Find)"
  - "perl(File::HomeDir)"
  - "perl(File::Path)"
  - "perl(File::Spec)"
  - "perl(File::Spec::Functions)"
  - "perl(File::Temp)"
  - "perl(FileHandle)"
  - "perl(FindBin)"
  - "perl(Getopt::Long)"
  - "perl(List::Util)"
  - "perl(Text::Tabs)"
  - "perl(Text::Wrap)"
  - "perl(Time::HiRes)"
  - "perl(Unicode::Normalize)"
  - "perl(YAML::Tiny)"
  - "perl(lib)"
  - "perl(open)"
  - "perl(sigtrap)"
  - "perl(vars)"

  # System libraries & compatibility
  - libcurl
  - aardvark-dns
  - gmp
  - libssh2
  - mbedtls
  - libxcrypt-compat

  - chatgpt

remove-from-packages: [["chatgpt", "/etc/.*"]]

exclude-packages:
  - low-memory-monitor
  - passim
  - gnome-session-xsession
  - hplip-gui

repos:
  - fedora
  - fedora-updates
  - fedora-updates-testing
  - vscode
  - dummy
  - pythia6
  - codex
  # - llvm-snapshot
  # - llvm-snapshot-rundep

postprocess:
  - |
    systemctl enable sshd.socket
    systemctl enable rpm-ostreed-automatic.timer
    rm /etc/grub.d/30_os-prober
    sudo ln -sfn /usr/lib/systemd/system/kmsconvt@.service /etc/systemd/system/autovt@.service

    sed '/pam_gnome_keyring/d' -i /etc/pam.d/*
