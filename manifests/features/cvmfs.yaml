packages:
  - cvmfs cvmfs-fuse3

repos:
  - cernvm

postprocess:
  - |
    #!/usr/bin/env bash
    set -eu
    unitdir=/usr/lib/systemd/system
    install -d /cvmfs "$unitdir"/cvmfs-.{mount,automount}.d /usr/lib/systemd/system-preset

    cat > "$unitdir/cvmfs.mount" <<'EOF'
    [Unit]
    Description=Temporary filesystem for CVMFS mount points

    [Mount]
    What=tmpfs
    Where=/cvmfs
    Type=tmpfs
    Options=nofail

    [Install]
    WantedBy=local-fs.target
    EOF

    for type in mount automount; do
      cat > "$unitdir/cvmfs-.$type.d/10-requires-cvmfs.conf" <<'EOF'
    [Unit]
    RequiresMountsFor=/cvmfs
    EOF
    done

    echo 'enable cvmfs.mount' > /usr/lib/systemd/system-preset/80-cvmfs.preset
