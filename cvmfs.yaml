packages:
  - cvmfs cvmfs-fuse3

repos:
  - cernvm

postprocess:
  - |
    #!/usr/bin/env bash
    # /cvmfs won't work unless root.transient is set to true
    # set to /run/cvmfs only for container workloads
    echo 'd /run/cvmfs 0755 root root -' >> /usr/lib/tmpfiles.d/cvmfs.conf
    # this changes tooo much
    # echo -e '[root]\ntransient = true' >> /usr/lib/ostree/prepare-root.conf
