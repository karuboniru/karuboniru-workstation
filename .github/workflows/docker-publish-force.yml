name: Diagnose AppArmor and bubblewrap
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v3
      - name: Inspect host
        run: |
          uname -a
          sudo aa-status
          sudo cat /etc/apparmor.d/bwrap-userns-restrict
      - name: Prepare Fedora probe image
        run: |
          docker build -t apparmor-probe - <<'EOF'
          FROM registry.fedoraproject.org/fedora@sha256:b3bfa9b46c1a42b87020ea9053b56d24d713a0c551427669dee177230f1c720e
          RUN dnf -y --enablerepo=updates-testing install bubblewrap systemd
          EOF
      - name: Probe privileged container
        run: docker run --rm --privileged -v "$PWD/diagnostics:/diagnostics:ro" apparmor-probe bash /diagnostics/apparmor-probe.sh
      - name: Probe explicit AppArmor unconfined
        run: docker run --rm --privileged --security-opt apparmor=unconfined -v "$PWD/diagnostics:/diagnostics:ro" apparmor-probe bash /diagnostics/apparmor-probe.sh
      - name: Inspect AppArmor denials
        if: always()
        run: sudo dmesg | grep -E 'apparmor="DENIED"|unpriv_bwrap' | tail -n 60 || true
      - name: Unload bwrap profile on this disposable runner
        run: sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
      - name: Probe after unloading bwrap profile
        run: docker run --rm --privileged --security-opt apparmor=unconfined -v "$PWD/diagnostics:/diagnostics:ro" apparmor-probe bash /diagnostics/apparmor-probe.sh
      - name: Restore host profile
        if: always()
        run: sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
