name: Build Ostree Container Image

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: "00 0,8,16 * * *"
  push:
    branches: ["*"]

concurrency:
  group: publish-image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45
      options: --privileged
      volumes:
        - /:/host:rw
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Disable host bwrap AppArmor profile
        run: |
          # Ubuntu's bwrap profile denies capabilities needed by systemd-sysusers.
          # Access the disposable runner's AppArmor tools through the host mount.
          if [ -f /host/etc/apparmor.d/bwrap-userns-restrict ]; then
            chroot /host /usr/sbin/apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Build
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          composefile: ${{ vars.COMPOSEFILE }}
        run: |
          dnf -y --enablerepo=updates-testing install rpm-ostree skopeo jq diffutils selinux-policy-targeted clang distribution-gpg-keys fedora-gpg-keys
          # df -h /host
          # for i in '__t/*' 'usr/local/' '/usr/share/dotnet' '/opt' ; do
          #   rm -rf /host/$i || true
          # done
          # df -h /host
          skopeo login -u $username -p $password $registry
          bash scripts/publish-image.sh
